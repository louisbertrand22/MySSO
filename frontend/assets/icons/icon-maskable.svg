<!-- "maskable" / Apple icon: full-bleed square, glyph inside the 80% safe zone (the OS applies its own shape) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22966c"/>
      <stop offset="1" stop-color="#146b4c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g fill="none" stroke="#f4fffa" stroke-width="34" stroke-linecap="round">
    <circle cx="256" cy="220" r="60"/>
    <path d="M256 280V368"/>
  </g>
</svg>
